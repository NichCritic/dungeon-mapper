name: Build and Release

on:
  push:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if version changed
        id: check
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git tag -l "v${VERSION}-*" | grep -q .; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION already released, skipping build"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New version $VERSION, will build and release"
          fi

  build-linux:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libatk1.0-dev libglib2.0-dev

      - name: Build
        env:
          UPDATE_PUBLIC_KEY: ${{ secrets.UPDATE_PUBLIC_KEY }}
        run: cargo build --release

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: dungeon-mapper-linux
          path: target/release/dungeon-mapper
          retention-days: 1

  build-windows:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu

      - name: Build for Windows
        env:
          UPDATE_PUBLIC_KEY: ${{ secrets.UPDATE_PUBLIC_KEY }}
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: dungeon-mapper-windows
          path: target/x86_64-pc-windows-gnu/release/dungeon-mapper.exe
          retention-days: 1

  build-keygen:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache signing tool
        id: cache-keygen
        uses: actions/cache@v4
        with:
          path: target/release/keygen
          key: keygen-${{ hashFiles('tools/keygen.rs', 'Cargo.toml', 'Cargo.lock') }}

      - name: Build signing tool
        if: steps.cache-keygen.outputs.cache-hit != 'true'
        run: cargo build --release --bin keygen

      - name: Upload keygen
        uses: actions/upload-artifact@v4
        with:
          name: keygen
          path: target/release/keygen
          retention-days: 1

  release:
    needs: [build-linux, build-windows, build-keygen]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: dungeon-mapper-linux
          path: artifacts/linux

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: dungeon-mapper-windows
          path: artifacts/windows

      - name: Download keygen
        uses: actions/download-artifact@v4
        with:
          name: keygen
          path: artifacts/keygen

      - name: Sign binaries
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          chmod +x artifacts/keygen/keygen
          echo "$SIGNING_KEY" > /tmp/signing.key
          ./artifacts/keygen/keygen --sign artifacts/linux/dungeon-mapper --key /tmp/signing.key
          ./artifacts/keygen/keygen --sign artifacts/windows/dungeon-mapper.exe --key /tmp/signing.key
          rm /tmp/signing.key

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "tag=v${VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Build ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: |
            artifacts/linux/dungeon-mapper
            artifacts/linux/dungeon-mapper.sig
            artifacts/windows/dungeon-mapper.exe
            artifacts/windows/dungeon-mapper.exe.sig

      - name: Delete unsigned artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            dungeon-mapper-linux
            dungeon-mapper-windows
            keygen
