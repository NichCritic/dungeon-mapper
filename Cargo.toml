[package]
name = "dungeon-mapper"
version = "0.3.3"
edition = "2024"
default-run = "dungeon-mapper"

[dependencies]
eframe = "0.31"
egui = "0.31"
egui_extras = { version = "0.31", features = ["image", "file"] }
petgraph = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
rfd = "0.15"
pollster = "0.4"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
regex = "1"
tungstenite = "0.24"
ed25519-dalek = { version = "2", features = ["rand_core"] }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
open = "5"
self-replace = "1"
semver = "1"

[[bin]]
name = "dungeon-mapper"
path = "src/main.rs"

[[bin]]
name = "keygen"
path = "tools/keygen.rs"
